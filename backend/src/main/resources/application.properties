```properties
# ==========================================
# ExamAllocate - Spring Boot Configuration
# ==========================================

# Server Configuration
server.port=${PORT:8080}

# ==========================================
# Aiven MySQL Database Configuration
# Set these environment variables in Render
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# Tables are imported using the SQL file
# ==========================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# ==========================================
# JSON Configuration
# ==========================================

spring.jackson.serialization.write-dates-as-timestamps=false

# ==========================================
# CORS Configuration
# Update allowed origin when frontend URL is ready
# ==========================================

examallocate.cors.allowed-origin=*

# ==========================================
# Admin Configuration
# Set ADMIN_KEY in Render to a secret value
# ==========================================

examallocate.admin-key=${ADMIN_KEY}

# ==========================================
# Swagger UI
# ==========================================

springdoc.swagger-ui.path=/swagger-ui.html
```
